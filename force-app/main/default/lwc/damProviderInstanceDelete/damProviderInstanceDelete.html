<template>
	<lightning-card title="Delete Provider Instance">
		<div class="slds-p-around_medium">
			<lightning-input label="Provider Instance Id" value={providerInstanceId} onchange={handleChange} required></lightning-input>
			<lightning-combobox class="slds-m-top_small" label="Or pick an existing instance" value={providerInstanceId} options={instanceOptions} placeholder="Select instance" onchange={handlePick}></lightning-combobox>
			<lightning-input class="slds-m-top_small" label="Confirm Provider Instance Id" value={confirmId} onchange={handleConfirmChange} required></lightning-input>
			<lightning-input class="slds-m-top_small" type="checkbox" label="I understand this action permanently deletes the provider instance." checked={ack} onchange={handleAck}></lightning-input>
			<div class="slds-m-top_medium">
				<lightning-button variant="destructive" label="Delete" onclick={handleDelete} disabled={disableDelete}></lightning-button>
			</div>
		</div>
	</lightning-card>
</template>
